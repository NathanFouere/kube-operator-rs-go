[package]
name = "memcached-controller-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
doc = false
name = "crdgen"
path = "src/crdgen.rs"

[lib]
name = "controller"
path = "src/lib.rs"

[dependencies]
actix-web = "4.12.1"
kube = { version = "5.0.0", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.29.0", features = ["latest", "schemars"] }
schemars = { version = "1" }
anyhow = "1.0.101"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
jiff = "0.2.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.25"
thiserror = "2.0.18"
futures = "0.3.32"
